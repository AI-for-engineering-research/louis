<path class="edge" d="M137,490 V506"/>

<!-- container -->
<rect x="290" y="326" width="894" height="234" rx="10" fill="none" stroke="var(--code-s)" stroke-width="1.4" stroke-dasharray="7 5"/>
<text class="bt mono" x="306" y="349" style="font-size:12px;fill:var(--code-s)">loop/run_iteration.py --label --k --scheme --snow-as-ice --in-cloud-reff --overlap</text>

<rect x="310" y="388" width="150" height="64" rx="7" fill="var(--code-f)" stroke="var(--code-s)" stroke-width="1.2"/>
<text class="bt" x="385" y="409" text-anchor="middle" style="font-size:12px">crtm-inputs CLI</text>
<text class="bm" x="385" y="426" text-anchor="middle">make_crtm_input</text>
<text class="bm mono" x="385" y="441" text-anchor="middle">+ --scheme-plugin</text>

