<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 940" width="1220" height="940" role="img" aria-labelledby="t d">
<title id="t">Cloud-matching loop — how the context files and the run pipeline fit together</title>
<desc id="d">STATUS.md is the entry point; HANDOFF.md holds stable orientation and the canonical run commands; run_iteration.py produces a run directory and auto-appends LOG.md; the agent reads the images and metrics, then prunes STATUS.md and edits HANDOFF.md in place.</desc>

<style>
  :root{
    --bg:#ffffff; --ink:#1f2328; --muted:#57606a; --line:#8c959f; --rule:#d8dee4;
    --doc-f:#e9f1fb;  --doc-s:#3b6ea5;
    --key-f:#fff2e8;  --key-s:#c2410c;
    --log-f:#e6f4ec;  --log-s:#2b7a4b;
    --code-f:#f2eafb; --code-s:#6f42c1;
    --data-f:#f1f2f4; --data-s:#6e7781;
    --think-f:#fdeaf0;--think-s:#b02a4a;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0d1117; --ink:#e6edf3; --muted:#9198a1; --line:#6e7681; --rule:#30363d;
      --doc-f:#10233a;  --doc-s:#5b9bd5;
      --key-f:#3a1d0c;  --key-s:#f0883e;
      --log-f:#0d2a1a;  --log-s:#3fb950;
      --code-f:#231437; --code-s:#a371f7;
      --data-f:#161b22; --data-s:#8b949e;
      --think-f:#3a1020;--think-s:#f0637c;
    }
  }
  .bg{fill:var(--bg)}
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; fill:var(--ink)}
  .h1{font-size:21px;font-weight:700}
  .h2{font-size:12px;font-weight:700;fill:var(--muted);letter-spacing:.8px}
  .sub{font-size:12.5px;fill:var(--muted)}
  .bt{font-size:13.5px;font-weight:700}
  .bd{font-size:10.4px;fill:var(--ink)}
  .bm{font-size:10.4px;fill:var(--muted)}
  .it{font-size:9.6px;fill:var(--muted);font-style:italic}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .el{font-size:9.6px;fill:var(--muted)}
  .pill{font-size:9px;font-weight:700;letter-spacing:.5px;text-anchor:middle}

  .edge{fill:none;stroke:var(--line);stroke-width:1.5;marker-end:url(#ah)}
  .xref{fill:none;stroke:var(--muted);stroke-width:1.3;stroke-dasharray:5 4;marker-end:url(#ahm)}
  .loop{fill:none;stroke:var(--think-s);stroke-width:2.6;marker-end:url(#aht)}
  .ah{fill:var(--line)} .ahm{fill:var(--muted)} .aht{fill:var(--think-s)}
  .rule{stroke:var(--rule);stroke-width:1}
</style>

<defs>
  <marker id="ah"  viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah"  d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ahm" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="aht" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="aht" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>

<rect class="bg" x="0" y="0" width="1220" height="940"/>

<text class="h1" x="32" y="40">Cloud-matching loop — context files &amp; the iteration workflow</text>
<text class="sub" x="32" y="62"><tspan class="mono">crtm-inputs/optimization-color/</tspan> · each doc has a maintenance contract; the write mode is the point</text>

<!-- ============ 1. ORIENT ============ -->
<text class="h2" x="32" y="104">① ORIENT — the reading order</text>

<!-- STATUS.md -->
<rect x="32" y="118" width="250" height="150" rx="8" fill="var(--key-f)" stroke="var(--key-s)" stroke-width="1.8"/>
<text class="bt" x="48" y="146">STATUS.md</text>
<rect x="196" y="126" width="78" height="17" rx="8.5" fill="var(--key-s)"/>
<text class="pill" x="235" y="138.5" style="fill:var(--bg)">READ FIRST</text>
<text class="bd" x="48" y="172">Where we are — current best config</text>
<text class="bd" x="48" y="189">+ metrics, settled findings, open threads.</text>
<line class="rule" x1="48" y1="201" x2="266" y2="201"/>
<text class="bm" x="48" y="219">Prune, don't append. ≤ ~100 lines.</text>
<text class="bm" x="48" y="236">Evidence → grep the LOG.md Index</text>
<text class="bm" x="48" y="253">before re-running anything.</text>

<!-- HANDOFF.md -->
<rect x="326" y="118" width="250" height="150" rx="8" fill="var(--doc-f)" stroke="var(--doc-s)" stroke-width="1.2"/>
<text class="bt" x="342" y="146">HANDOFF.md</text>
<rect x="483" y="126" width="85" height="17" rx="8.5" fill="none" stroke="var(--doc-s)"/>
<text class="pill" x="525.5" y="138.5" style="fill:var(--doc-s)">EDIT IN PLACE</text>
<text class="bd" x="342" y="170">Stable orientation beneath STATUS:</text>
<text class="bd" x="342" y="187">§1 goal · §2 seven framing decisions</text>
<text class="bd" x="342" y="204">§4 how to run — canonical commands</text>
<text class="bd" x="342" y="221">§5 tools built · §6 verified facts</text>
<text class="bd" x="342" y="238">§8 thread archive · §9 gotchas</text>
<text class="it" x="342" y="257">Running commentary goes to LOG.md.</text>

<!-- REFERENCES.md -->
<rect x="620" y="118" width="264" height="74" rx="8" fill="var(--doc-f)" stroke="var(--doc-s)" stroke-width="1.2"/>
<text class="bt" x="636" y="142">REFERENCES.md</text>
<rect x="824" y="126" width="52" height="17" rx="8.5" fill="none" stroke="var(--doc-s)"/>
<text class="pill" x="850" y="138.5" style="fill:var(--doc-s)">APPEND</text>
<text class="bd" x="636" y="164">Literature &amp; parametrization science —</text>
<text class="bd" x="636" y="181">Wyser · Martin · Sun-Rikus · IFS CY49R1.</text>

<!-- CONTEXT.md -->
<rect x="620" y="200" width="264" height="68" rx="8" fill="var(--doc-f)" stroke="var(--doc-s)" stroke-width="1.2"/>
<text class="bt" x="636" y="222">CONTEXT.md</text>
<rect x="824" y="207" width="52" height="17" rx="8.5" fill="none" stroke="var(--doc-s)"/>
<text class="pill" x="850" y="219.5" style="fill:var(--doc-s)">STABLE</text>
<text class="bd" x="636" y="242">Glossary: ash composite · reference vs</text>
<text class="bd" x="636" y="259">simulated image · on-disk pixel.</text>

<!-- Supporting evidence -->
<rect x="920" y="118" width="264" height="150" rx="8" fill="var(--data-f)" stroke="var(--data-s)" stroke-width="1.2"/>
<text class="bt" x="936" y="146">Supporting evidence</text>
<text class="bd mono" x="936" y="172">docs/adr/0001-…-cli-plugins.md</text>
<text class="bd mono" x="936" y="189">split-window-literature.md</text>
<text class="bd mono" x="936" y="206">reff-tradeoff-vs-era5-report.html</text>
<text class="bd mono" x="936" y="223">literature/ifs-cy49r1-part-iv.pdf</text>
<text class="it" x="936" y="248">Cited from above; frozen, not maintained.</text>

<path class="xref" d="M282,193 H322"/>
<path class="xref" d="M576,193 H596 M596,193 V155 H616"/>
