<text class="bt mono" x="541" y="415" text-anchor="middle" style="font-size:11.5px">crtm_input.nc</text>
<text class="bm" x="541" y="432" text-anchor="middle">(profile, layer)</text>

<rect x="622" y="388" width="130" height="64" rx="7" fill="var(--code-f)" stroke="var(--code-s)" stroke-width="1.2"/>
<text class="bt" x="687" y="413" text-anchor="middle" style="font-size:12px">crtm-driver</text>
<text class="bm mono" x="687" y="430" text-anchor="middle">config.nml · maxran</text>

<rect x="778" y="388" width="110" height="64" rx="7" fill="var(--data-f)" stroke="var(--data-s)" stroke-width="1.2"/>
<text class="bt mono" x="833" y="415" text-anchor="middle" style="font-size:11.5px">crtm_out.nc</text>
<text class="bm" x="833" y="432" text-anchor="middle">BT per channel</text>

<rect x="914" y="388" width="160" height="64" rx="7" fill="var(--code-f)" stroke="var(--code-s)" stroke-width="1.2"/>
<text class="bt mono" x="994" y="409" text-anchor="middle" style="font-size:12px">loop/ashlib.py</text>
<text class="bm" x="994" y="426" text-anchor="middle">ash RGB + BT metrics</text>
<text class="bm" x="994" y="441" text-anchor="middle">full &amp; cloud-masked</text>

<rect x="310" y="478" width="200" height="52" rx="7" fill="var(--code-f)" stroke="var(--code-s)" stroke-width="1.2"/>
<text class="bt mono" x="322" y="498" style="font-size:10px">*_plugin.py — ADR 0001</text>
<text class="bm" x="322" y="516" style="font-size:9.4px">wyser · martin · sunrikus · constliq</text>
<path class="edge" d="M405,478 V456"/>

<text class="el" x="532" y="492">Run in the <tspan class="mono">test</tspan> pixi env — matplotlib is not in the default env.</text>
<text class="el" x="532" y="510">Schemes are authored here, registered via the CLI plugin seam,</text>
<text class="el" x="532" y="528">promoted into the package once proven. Sensor <tspan class="mono">abi_g16</tspan> proxies GOES-19.</text>

