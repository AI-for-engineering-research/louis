<!-- ============ 3. RECORD ============ -->
<text class="h2" x="32" y="596">③ RECORD — what each run leaves behind</text>

<rect x="290" y="614" width="380" height="120" rx="8" fill="var(--data-f)" stroke="var(--data-s)" stroke-width="1.2"/>
<text class="bt mono" x="306" y="638" style="font-size:12.5px">loop/runs/&lt;label&gt;/</text>
<text class="bd" x="306" y="663"><tspan class="mono">compare.png</tspan>  ← open this first</text>
<text class="bm mono" x="306" y="681">error_maps.png · metrics.json</text>
<text class="bm mono" x="306" y="699">sim_ash.npy · crtm_input.nc · crtm_out.nc</text>
<text class="it" x="306" y="720">One directory per labelled iteration, kept for comparison.</text>

<rect x="700" y="614" width="300" height="120" rx="8" fill="var(--log-f)" stroke="var(--log-s)" stroke-width="1.8"/>
<text class="bt" x="716" y="638">LOG.md</text>
<rect x="906" y="622" width="86" height="17" rx="8.5" fill="var(--log-s)"/>
<text class="pill" x="949" y="634.5" style="fill:var(--bg)">APPEND-ONLY</text>
<text class="bd" x="716" y="663">One entry per run or investigation:</text>
<text class="bd" x="716" y="681">hypothesis · verbatim command · timings</text>
<text class="bd" x="716" y="699">· BT metrics + one row in the Index table.</text>
<text class="it" x="716" y="720">Never edit or delete a past entry. Grep the Index.</text>

<rect x="1030" y="614" width="154" height="120" rx="8" fill="var(--code-f)" stroke="var(--code-s)" stroke-width="1.2"/>
<text class="bt mono" x="1042" y="638" style="font-size:11.5px">loop/diag_*.py</text>
<text class="bm" x="1042" y="661">overcast · splitwindow</text>
<text class="bm" x="1042" y="677">coldtops · green</text>
<text class="bm" x="1042" y="693">intersection</text>
<text class="it" x="1042" y="716">→ invest / synth entries</text>

<path class="edge" d="M480,560 V610"/>
<text class="el" x="488" y="592">writes</text>
<path class="edge" d="M860,560 V610"/>
<text class="el" x="868" y="592">auto-appends one entry</text>
<path class="edge" d="M1030,674 H1004"/>

<!-- ============ 4. JUDGE ============ -->
<text class="h2" x="32" y="768">④ JUDGE — read, reason, then edit the docs</text>

<rect x="290" y="784" width="470" height="104" rx="8" fill="var(--think-f)" stroke="var(--think-s)" stroke-width="1.8"/>
<text class="bt" x="306" y="810">Agent judgment — the loop's real work</text>
<text class="bd" x="306" y="833">Open <tspan class="mono">compare.png</tspan> first — the primary signal is visual;</text>
<text class="bd" x="306" y="851">the metric backs it up, it is never minimized over free knobs.</text>
<text class="bd" x="306" y="869">Every change must be physically explainable (no magic constants).</text>

<path class="edge" d="M480,734 V780"/>
<path class="edge" d="M720,734 V780"/>

<path class="loop" d="M290,836 H12 V193 H28"/>
<text class="el" x="300" y="912">Then: <tspan font-weight="700">prune</tspan> STATUS.md · <tspan font-weight="700">edit</tspan> HANDOFF.md in place · <tspan font-weight="700">append</tspan> REFERENCES.md · form the next hypothesis.</text>

