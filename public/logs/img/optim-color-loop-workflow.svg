<!-- ============ 2. RUN ============ -->
<text class="h2" x="32" y="300">② RUN — one labelled iteration</text>

<rect x="32" y="330" width="210" height="84" rx="8" fill="var(--data-f)" stroke="var(--data-s)" stroke-width="1.2"/>
<text class="bt" x="44" y="352">Fixed inputs</text>
<text class="bm" x="44" y="371">ERA5 pl + sl · 2025-12-10 00:00</text>
<text class="bm" x="44" y="387">EASE-Grid land classification</text>
<text class="bm" x="44" y="403">ABI georef · reference/ash.npy</text>

<rect x="32" y="438" width="210" height="52" rx="8" fill="var(--code-f)" stroke="var(--code-s)" stroke-width="1.2"/>
<text class="bt mono" x="44" y="459" style="font-size:10.5px">loop/make_coarse_grid.py --k</text>
<text class="bm" x="44" y="477" style="font-size:9.8px">once per stride k (8, 12, then 1)</text>

<rect x="32" y="510" width="210" height="60" rx="8" fill="var(--data-f)" stroke="var(--data-s)" stroke-width="1.2"/>
<text class="bt mono" x="44" y="532" style="font-size:12px">loop/grid/</text>
<text class="bm mono" x="44" y="551">coarse_kN.nc · reference_kN.npz</text>

