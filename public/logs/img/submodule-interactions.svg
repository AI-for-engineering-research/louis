<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 1240" width="1360" height="1240" role="img" aria-labelledby="t d">
<title id="t">The crtm-experiments submodule — pin, seam, run, and the edit/bump lifecycle</title>
<desc id="d">Technical reference for how the crtm-effr-exploration repo interacts with its pinned crtm-experiments submodule: the outer repo pins the submodule by a committed gitlink (75d19d9, tagged effr-pin-2026-07-15); this repo's plugins register into the submodule's crtm-inputs package through the ADR-0001 extension seam without forking; one run threads run_iteration.py through the submodule's pixi env, crtm-inputs-cli, the compiled crtm-driver and its CloudCoeff lookup table; the pin has three views (committed gitlink = authoritative, submodule working tree, tag name) reconciled by loop/check_pin.sh; and changes follow an additive edit-on-a-branch protocol where only the human deliberately bumps the pin. provenance.json records the two SHAs plus the LUT hash.</desc>

